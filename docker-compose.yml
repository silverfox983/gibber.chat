# =============================================================================
# Gibber — full web application stack with ALL Slidge gateway transports.
# =============================================================================
#
# What this brings up:
#   prosody         XMPP server (clients + S2S + websockets) and the
#                   external-component listener the gateways register on
#   gibber-backend  REST + websocket proxy + account provisioning + gateway mgmt
#   web-build       one-shot Flutter web build (output shared via web_build)
#   caddy           TLS edge: static web app + API/XMPP-websocket reverse proxy
#   janus           WebRTC SFU for group calls
#   coturn          TURN/STUN for peer connections
#   biboumi         IRC gateway (config rendered via biboumi-config init)
#   slidgram        Telegram gateway      (profile: telegram / slidge)
#   slidcord        Discord gateway      (profile: discord  / slidge)
#   matridge        Matrix gateway       (profile: matrix   / slidge)
#   slidge-whatsapp WhatsApp gateway     (profile: whatsapp / slidge)
#
# Usage:
#   cp .env.example .env      # then EDIT THE SECRETS
#   docker compose up -d                          # core webapp only
#   docker compose --profile slidge up -d         # core + ALL gateways
#   docker compose --profile irc up -d            # core + IRC only (landing
#                                                 #  page trending rooms need
#                                                 #  this for the join flow)
#
# After the first start, gateways register with Prosody automatically. Verify
# with `docker compose logs biboumi` (the join flow on the website resolves
# the IRC gateway through the backend /gateways endpoint).

name: gibber

services:
  # ===========================================================================
  # XMPP server
  # ===========================================================================
  prosody:
    build: ./gibber-backend/prosody
    container_name: gibber-prosody
    restart: unless-stopped
    ports:
      - "5222:5222"   # Client-to-server (plain; web clients use the websocket)
      - "5269:5269"   # Server-to-server federation
      - "5280:5280"   # BOSH / prosody admin HTTP
      - "5281:5281"   # BOSH HTTPS
    volumes:
      - ./gibber-backend/config/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - ./gibber-backend/config/slidge-user-components.conf:/etc/prosody/slidge-user-components.conf:ro
      - ./gibber-backend/config/slidge-providers.conf.lua:/etc/prosody/slidge-providers.conf:ro
      - prosody_data:/var/lib/prosody
      - prosody_certs:/etc/prosody/certs
    environment:
      DOMAIN: ${GIBBER_SITE:-gibberapp.online}
      # Gateway component secrets — MUST MATCH the values on the gateway
      # containers below.
      SLIDIRC_SECRET: ${SLIDIRC_SECRET:-change-me-irc-secret}
      SLIDGRAM_SECRET: ${SLIDGRAM_SECRET:-change-me-telegram-secret}
      SLIDCORD_SECRET: ${SLIDCORD_SECRET:-change-me-discord-secret}
      MATRIDGE_SECRET: ${MATRIDGE_SECRET:-change-me-matrix-secret}
      SLIDGWHATSAPP_SECRET: ${SLIDGEWHATSAPP_SECRET:-change-me-whatsapp-secret}
    networks: [gibber]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '/usr/bin/prosody' || pgrep -f 'prosody -F'"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Backend (REST API, XMPP websocket proxy, account provisioning)
  # ===========================================================================
  gibber-backend:
    build: ./gibber-backend
    container_name: gibber-backend
    restart: unless-stopped
    # Split-compose entrypoint override: the image's default entrypoint styles a
    # monolith (prosody/janus/coturn in one container). The server binary reads
    # all configuration from GIBBER_* env, which this compose provides.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /app/data /app/web && exec /app/bin/server"]
    ports:
      - "8080:8080"   # Direct API access (caddy is the TLS front)
    volumes:
      - backend_data:/app/data
      - ./gibber-backend/config/prosody.cfg.lua:/app/config/prosody.cfg.lua:ro
      - prosody_data:/var/lib/prosody
      - web_build:/app/web
    environment:
      GIBBER_DB_PATH: /app/data/gibber_backend.db
      GIBBER_PROSODY_CONFIG: /app/config/prosody.cfg.lua
      GIBBER_HOST: 0.0.0.0
      GIBBER_PORT: 8080
      GIBBER_ADMIN_KEY: ${GIBBER_ADMIN_KEY:-gibber-admin-key-change-in-production}
      GIBBER_REGISTRATION_MODE: ${GIBBER_REGISTRATION_MODE:-xmpp}
      GIBBER_PROSODY_URL: http://prosody:5280
      GIBBER_ENABLE_SASL2: 1
      GIBBER_USE_DOCKER: 1
      GIBBER_JWT_SECRET: ${GIBBER_JWT_SECRET:-change-me-in-production-use-a-strong-random-string}
      GIBBER_WEB_DIR: /app/web
      GIBBER_JANUS_URL: ws://janus:8188
      GIBBER_JANUS_API_KEY: ${GIBBER_JANUS_API_KEY:-janus-api-key-change-in-production}
      GIBBER_TURN_URL: turn:${GIBBER_SITE:-gibberapp.online}:3478
      GIBBER_TURN_USER: ${GIBBER_TURN_USER:-gibber}
      GIBBER_TURN_PASS: ${GIBBER_TURN_PASS:-gibber-turn-secret-change-in-production}
      GIBBER_GIPHY_API_KEY: ${GIBBER_GIPHY_API_KEY:-}
      GIBBER_PUSH_SECRET: ${GIBBER_PUSH_SECRET:-gibber-push-trigger-secret-change-in-production}
      GIBBER_SLIDGE_SECRET: ${GIBBER_SLIDGE_SECRET:-change-me-in-production}
      # Mirror the gateways actually deployed via profiles: the /gateways
      # endpoint reports these (the client's join flow gates on them).
      GIBBER_SLIDIRC_ENABLED: ${SLIDIRC_ENABLED:-true}
      GIBBER_SLIDGRAM_ENABLED: ${SLIDGRAM_ENABLED:-false}
      GIBBER_SLIDCORD_ENABLED: ${SLIDCORD_ENABLED:-false}
      GIBBER_MATRIDGE_ENABLED: ${MATRIDGE_ENABLED:-false}
      GIBBER_SLIDGEWHATSAPPER_ENABLED: ${SLIDGEWHATSAPP_ENABLED:-false}
      GIBBER_SPLIT_GATEWAYS: "true"
      IRC_SERVER_HOSTNAME: ${IRC_SERVER_HOSTNAME:-irc.libera.chat}
      GIBBER_JANUS_HTTP_URL: http://janus:8088
      GIBBER_COTURN_HOST: coturn
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BTCPAY_URL: ${BTCPAY_URL:-}
      BTCPAY_API_KEY: ${BTCPAY_API_KEY:-}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID:-}
    depends_on:
      prosody:
        condition: service_healthy
    networks: [gibber]

  # ===========================================================================
  # Flutter web build (one-shot; result served by caddy/backend)
  # ===========================================================================
  web-build:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: gibber-web:latest
    volumes:
      - web_build:/web
    restart: "no"

  # ===========================================================================
  # TLS edge: static web app + reverse proxy
  # ===========================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: gibber-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - web_build:/srv/gibber-web:ro
    environment:
      GIBBER_SITE: ${GIBBER_SITE:-gibberapp.online}
    depends_on:
      gibber-backend:
        condition: service_started
      web-build:
        condition: service_completed_successfully
    networks: [gibber]

  # ===========================================================================
  # Media cluster
  # ===========================================================================
  janus:
    image: canyan/janus-gateway:master
    container_name: gibber-janus
    restart: unless-stopped
    ports:
      - "8188:8188"                    # Janus WebSocket
      - "8088:8088"                    # Janus HTTP API
      - "10000-10020:10000-10020/udp"  # RTP media
    volumes:
      - ./gibber-backend/config/janus:/etc/janus:ro
    environment:
      JANUS_LOG_LEVEL: "5"
    networks: [gibber]

  coturn:
    image: coturn/coturn:alpine
    container_name: gibber-coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    command:
      - --realm=${GIBBER_SITE:-gibberapp.online}
      - --server-name=${GIBBER_SITE:-gibberapp.online}
      - --lt-cred-mech
      - --user=${GIBBER_TURN_USER:-gibber}:${GIBBER_TURN_PASS:-gibber-turn-secret-change-in-production}
      - --no-multicast-peers
      - --no-cli
    networks: [gibber]

  # ===========================================================================
  # IRC gateway (biboumi — the reference XMPP↔IRC component; the slidge family
  # has no IRC gateway). Rooms are served as #channel@irc.<domain>.
  # ===========================================================================
  biboumi-config:
    image: busybox:stable
    container_name: gibber-biboumi-config
    restart: "no"
    profiles: [irc, slidge]
    volumes:
      - ./docker/biboumi/biboumi.cfg.template:/biboumi.cfg.template:ro
      - biboumi_cfg:/etc/biboumi
    command:
      - sh
      - -c
      - |
        sed -e "s/__SLIDIRC_SECRET__/${SLIDIRC_SECRET:-change-me-irc-secret}/" \
            -e "s/__IRC_SERVER_HOSTNAME__/${IRC_SERVER_HOSTNAME:-irc.libera.chat}/" \
            /biboumi.cfg.template > /etc/biboumi/biboumi.cfg
        echo "biboumi.cfg rendered"
    networks: [gibber]

  biboumi:
    image: louiz/biboumi:9.0
    container_name: gibber-biboumi
    restart: unless-stopped
    profiles: [irc, slidge]
    volumes:
      - biboumi_cfg:/etc/biboumi
      - biboumi_data:/var/lib/biboumi
    depends_on:
      biboumi-config:
        condition: service_completed_successfully
      prosody:
        condition: service_healthy
    networks: [gibber]

  # Prepares the writable data dirs for the slidge gateways. The containers run
  # as the `slidge` user; named volumes start root-owned.
  slidge-init:
    image: busybox:stable
    restart: "no"
    profiles: [slidge, telegram, discord, matrix, whatsapp]
    command:
      - sh
      - -c
      - |
        mkdir -p /d-telegram /d-discord /d-matrix /d-whatsapp &&
        chmod 777 /d-telegram /d-discord /d-matrix /d-whatsapp &&
        echo "slidge data dirs ready"
    volumes:
      - slidge_data_telegram:/d-telegram
      - slidge_data_discord:/d-discord
      - slidge_data_matrix:/d-matrix
      - slidge_data_whatsapp:/d-whatsapp
    networks: [gibber]

  slidgram:
    image: codeberg.org/slidge/slidgram:latest
    container_name: gibber-slidgram
    restart: unless-stopped
    profiles: [telegram, slidge]
    environment:
      SLIDGE_JID: telegram.${GIBBER_SITE:-gibberapp.online}
      SLIDGE_SECRET: ${SLIDGRAM_SECRET:-change-me-telegram-secret}
      SLIDGE_SERVER: prosody
      SLIDGE_PORT: "5347"
    volumes:
      - slidge_data_telegram:/var/lib/slidge
    networks: [gibber]
    depends_on:
      slidge-init:
        condition: service_completed_successfully
      prosody:
        condition: service_healthy

  slidcord:
    image: codeberg.org/slidge/slidcord:latest
    container_name: gibber-slidcord
    restart: unless-stopped
    profiles: [discord, slidge]
    environment:
      SLIDGE_JID: discord.${GIBBER_SITE:-gibberapp.online}
      SLIDGE_SECRET: ${SLIDCORD_SECRET:-change-me-discord-secret}
      SLIDGE_SERVER: prosody
      SLIDGE_PORT: "5347"
    volumes:
      - slidge_data_discord:/var/lib/slidge
    networks: [gibber]
    depends_on:
      slidge-init:
        condition: service_completed_successfully
      prosody:
        condition: service_healthy

  matridge:
    image: codeberg.org/slidge/matridge:latest
    container_name: gibber-matridge
    restart: unless-stopped
    profiles: [matrix, slidge]
    environment:
      SLIDGE_JID: matrix.${GIBBER_SITE:-gibberapp.online}
      SLIDGE_SECRET: ${MATRIDGE_SECRET:-change-me-matrix-secret}
      SLIDGE_SERVER: prosody
      SLIDGE_PORT: "5347"
    volumes:
      - slidge_data_matrix:/var/lib/slidge
    networks: [gibber]
    depends_on:
      slidge-init:
        condition: service_completed_successfully
      prosody:
        condition: service_healthy

  slidge-whatsapp:
    image: codeberg.org/slidge/slidge-whatsapp:latest
    container_name: gibber-slidge-whatsapp
    restart: unless-stopped
    profiles: [whatsapp, slidge]
    environment:
      SLIDGE_JID: whatsapp.${GIBBER_SITE:-gibberapp.online}
      SLIDGE_SECRET: ${SLIDGEWHATSAPP_SECRET:-change-me-whatsapp-secret}
      SLIDGE_SERVER: prosody
      SLIDGE_PORT: "5347"
    volumes:
      - slidge_data_whatsapp:/var/lib/slidge
    networks: [gibber]
    depends_on:
      slidge-init:
        condition: service_completed_successfully
      prosody:
        condition: service_healthy

volumes:
  prosody_data:
  prosody_certs:
  backend_data:
  web_build:
  caddy_data:
  caddy_config:
  biboumi_cfg:
  biboumi_data:
  slidge_data_telegram:
  slidge_data_discord:
  slidge_data_matrix:
  slidge_data_whatsapp:

networks:
  gibber:
    driver: bridge