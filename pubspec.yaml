name: gibber
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  xmpp_stone: ^0.4.4-dev.6
  libsignal_protocol_dart: ^0.4.0 # Not web-compatible; OMEMO stubbed on web
  cryptography: ^2.7.0
  file_picker: ^10.3.10
  record: ^6.2.0
  audioplayers: ^6.1.0
  share_plus: ^10.1.3
  flutter_webrtc: ^1.4.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  intl: ^0.20.2
  http: ^1.2.1
  permission_handler: ^11.3.1
  proximity_sensor: ^1.1.2
  xml: ^6.5.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^0.4.5+2
  sqlite3_flutter_libs: ^0.6.0+eol
  web: ^1.1.1
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  image_picker: ^1.2.1
  flutter_markdown: ^0.7.7+1
  giphy_get: ^3.6.1+1
  sip_ua:
    path: packages/sip_ua
  flutter_local_notifications: ^21.0.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  crypto: ^3.0.7
  pointycastle: ^3.9.1
  google_fonts: ^8.1.0
  flutter_foreground_task: ^9.2.2
  archive: ^4.0.9
  any_link_preview: ^3.0.3
  html2md: ^1.3.2
  go_router: ^17.5.0
  flutter_turnstile: ^1.2.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/sounds/ringtone.mp3
    - assets/sounds/ringback.mp3
    - assets/sounds/message.mp3
    - assets/sounds/notification.mp3
    - assets/sounds/soundboard/

dependency_overrides:
  intl: ^0.20.2
  xmpp_stone:
    path: packages/xmpp_stone

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/logo.png"
    backgroundColor: "#ffffff"
    themeColor: "#ffffff"
