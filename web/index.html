<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="description" content="Gibber - Secure, decentralized chat powered by XMPP">
  <meta name="theme-color" content="#1a1a2e">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gibber">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta property="og:title" content="Gibber">
  <meta property="og:description" content="Secure, decentralized chat powered by XMPP">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Gibber</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0a0a1a;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .loading-text {
      color: #8888aa;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <svg class="loading-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" stroke="#6c5ce7" stroke-width="3" fill="none" opacity="0.6"/>
      <path d="M30 35h8v30h-8zm12 0h8v30h-8zm12 0h8v30h-8zm12 0h8v18h-8z" fill="#6c5ce7" opacity="0.8"/>
      <circle cx="76" cy="72" r="6" fill="#a29bfe"/>
    </svg>
    <div class="loading-text">Connecting...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
