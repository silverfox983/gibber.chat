services:
  prosody:
    build: ./prosody
    container_name: gibber_xmpp
    restart: unless-stopped
    ports:
      - "5222:5222"   # XMPP client-to-server
      - "5269:5269"   # XMPP server-to-server
      - "5280:5280"   # BOSH (HTTP)
      - "5281:5281"   # BOSH (HTTPS)
    volumes:
      - ./config/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - prosody_data:/var/lib/prosody
    environment:
      LOCAL: gibber
      DOMAIN: gibberapp.online
    networks:
      - gibber_net

  gibber-backend:
    build: .
    container_name: gibber_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config/prosody.cfg.lua:/app/config/prosody.cfg.lua:ro
      - prosody_data:/var/lib/prosody
      - web_build:/app/web
    environment:
      - GIBBER_DB_PATH=/app/data/gibber_backend.db
      - GIBBER_PROSODY_CONFIG=/app/config/prosody.cfg.lua
      - GIBBER_HOST=0.0.0.0
      - GIBBER_PORT=8080
      - GIBBER_ADMIN_KEY=gibber-admin-key-change-in-production
      - GIBBER_REGISTRATION_MODE=xmpp
      - GIBBER_PROSODY_URL=http://prosody:5280
      - GIBBER_ENABLE_SASL2=1
      - GIBBER_USE_DOCKER=1
      - GIBBER_JWT_SECRET=change-me-in-production-use-a-strong-random-string
      - GIBBER_WEB_DIR=/app/web
      - GIBBER_JANUS_URL=ws://janus:8188
      - GIBBER_JANUS_API_KEY=janus-api-key-change-in-production
      - GIBBER_TURN_URL=turn:gibberapp.online:3478
      - GIBBER_TURN_USER=gibber
      - GIBBER_TURN_PASS=gibber-turn-secret-change-in-production
    depends_on:
      - prosody
    networks:
      - gibber_net

  caddy:
    image: caddy:2-alpine
    container_name: gibber_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../build/web:/srv/gibber-web:ro
    depends_on:
      - gibber-backend
    networks:
      - gibber_net

  janus:
    image: canyan/janus-gateway:latest
    container_name: gibber_janus
    restart: unless-stopped
    ports:
      - "8188:8188"   # Janus WebSocket (janus-transport-websockets)
      - "8088:8088"   # Janus HTTP API (janus-transport-http)
      - "10000-10020:10000-10020/udp"  # RTP/RTCP media ports
    volumes:
      - ./config/janus:/etc/janus:ro
    environment:
      - JANUS_LOG_LEVEL=5
    networks:
      - gibber_net

  coturn:
    image: coturn/coturn:latest
    container_name: gibber_coturn
    restart: unless-stopped
    ports:
      - "3478:3478"     # STUN/TURN
      - "3478:3478/udp" # STUN/TURN
      - "5349:5349"     # TURNS (TLS)
      - "5349:5349/udp" # TURNS (DTLS)
      - "49152-49200:49152-49200/udp"  # Media relay ports
    command:
      - "--realm=gibberapp.online"
      - "--server-name=gibberapp.online"
      - "--lt-cred-mech"
      - "--user=gibber:gibber-turn-secret-change-in-production"
      - "--no-multicast-peers"
      - "--no-cli"
    networks:
      - gibber_net

volumes:
  prosody_data:
  caddy_data:
  caddy_config:
  web_build:

networks:
  gibber_net:
    driver: bridge