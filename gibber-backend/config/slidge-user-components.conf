-- Slidge gateway components for the split docker-compose deployment.
--
-- prosody.cfg.lua includes this file. Each gateway runs as its own container
-- (see the root docker-compose.yml) and registers with Prosody over the
-- external-component port (5347).
--
-- Secrets: Prosody reads them from its environment at config load time.
-- Set SLIDIRC_SECRET / SLIDGRAM_SECRET / SLIDCORD_SECRET / MATRIDGE_SECRET /
-- SLIDGWHATSAPP_SECRET on the prosody service and the SAME value on the
-- matching gateway container (a mismatch = component fails to reconnect).
--
-- Domain: components are subdomains of the XMPP domain. If you host a custom
-- domain, change `gibberapp.online` here and in the gateway container JIDs.
--
-- Note: Slidge implements the MUC namespace on its own component domain, so
-- no additional Prosody plugins are needed on these components.

Component "irc.gibberapp.online"
    name = "IRC Gateway"
    component_secret = os.getenv("SLIDIRC_SECRET") or "change-me-in-production"

Component "telegram.gibberapp.online"
    name = "Telegram Gateway"
    component_secret = os.getenv("SLIDGRAM_SECRET") or "change-me-in-production"

Component "discord.gibberapp.online"
    name = "Discord Gateway"
    component_secret = os.getenv("SLIDCORD_SECRET") or "change-me-in-production"

Component "matrix.gibberapp.online"
    name = "Matrix Gateway"
    component_secret = os.getenv("MATRIDGE_SECRET") or "change-me-in-production"

Component "whatsapp.gibberapp.online"
    name = "WhatsApp Gateway"
    component_secret = os.getenv("SLIDGWHATSAPP_SECRET") or "change-me-in-production"