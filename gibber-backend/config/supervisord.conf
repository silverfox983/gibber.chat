[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:prosody]
command=/usr/bin/prosody
user=prosody
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gibber-backend]
command=/app/bin/server --host 0.0.0.0 --port %(ENV_PORT)s --db-path /app/data/gibber_backend.db --config /etc/prosody/prosody.cfg.lua
environment=GIBBER_ADMIN_KEY="%(ENV_GIBBER_ADMIN_KEY)s",DOMAIN="%(ENV_DOMAIN)s"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true