name: Release Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-android:
    name: Build Android release artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run release smoke tests
        run: |
          


      - name: Build release APK
        run: flutter build apk --release

      - name: Compute build label
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "BUILD_LABEL=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "BUILD_LABEL=${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
          fi

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/chat_app-${BUILD_LABEL}-android.apk"
          (
            cd dist
            sha256sum "chat_app-${BUILD_LABEL}-android.apk" > SHA256SUMS.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.BUILD_LABEL }}
          path: |
            dist/chat_app-${{ env.BUILD_LABEL }}-android.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/chat_app-${{ env.BUILD_LABEL }}-android.apk
            dist/SHA256SUMS.txt
