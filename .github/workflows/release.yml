name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd packages/xmpp_stone && dart pub get && cd ../..
          cd packages/sip_ua && dart pub get && cd ../..

      - name: Build web
        run: flutter build web --release

      - name: Package web build
        run: |
          cd build/web
          tar czf ../../gibber-web-${GITHUB_REF_NAME}.tar.gz .
          cd ../..
          sha256sum gibber-web-${GITHUB_REF_NAME}.tar.gz > gibber-web-${GITHUB_REF_NAME}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: |
            gibber-web-${{ github.ref_name }}.tar.gz
            gibber-web-${{ github.ref_name }}.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gibber-web-${{ github.ref_name }}.tar.gz
            gibber-web-${{ github.ref_name }}.sha256

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd packages/xmpp_stone && dart pub get && cd ../..
          cd packages/sip_ua && dart pub get && cd ../..

      - name: Build APK
        run: flutter build apk --release

      - name: Package APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk gibber-${GITHUB_REF_NAME}-android.apk
          sha256sum gibber-${GITHUB_REF_NAME}-android.apk > gibber-${GITHUB_REF_NAME}-android.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            gibber-${{ github.ref_name }}-android.apk
            gibber-${{ github.ref_name }}-android.sha256

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gibber-${{ github.ref_name }}-android.apk
            gibber-${{ github.ref_name }}-android.sha256

  build-backend:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./gibber-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Build and push prosody
        uses: docker/build-push-action@v5
        with:
          context: ./gibber-backend/prosody
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/prosody:latest
            ghcr.io/${{ github.repository }}/prosody:${{ github.ref_name }}